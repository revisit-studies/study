name: Deploy To GitHub Pages

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
  pull_request:

concurrency:
  group: pages-deployment
  cancel-in-progress: false
  queue: max

jobs:
  deploy-main:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: ${{ github.ref == 'refs/heads/main' }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'yarn'

      - run: yarn install --immutable

      - name: Build main Firebase deployment
        run: yarn build
        env:
          VITE_BASE_PATH: "/${{ github.event.repository.name }}/"
          VITE_STORAGE_ENGINE: firebase

      - uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: .pages
          fetch-depth: 1

      - name: Deploy current-only main Firebase snapshot
        run: .github/scripts/publish-pages-snapshot.sh ./dist '' ./.pages

      - name: Build main Supabase deployment
        run: yarn build
        env:
          VITE_BASE_PATH: "/${{ github.event.repository.name }}/supabase/"
          VITE_STORAGE_ENGINE: supabase

      - name: Deploy current-only main Supabase snapshot
        run: .github/scripts/publish-pages-snapshot.sh ./dist supabase ./.pages

  deploy-dev:
    runs-on: ubuntu-latest
    if: ${{ github.ref == 'refs/heads/dev' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'yarn'

      - run: yarn install --immutable

      - name: Build dev Firebase deployment
        run: yarn build
        env:
          VITE_BASE_PATH: "/${{ github.event.repository.name }}/dev/"
          VITE_STORAGE_ENGINE: firebase

      - uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: .pages
          fetch-depth: 1

      - name: Deploy current-only dev Firebase snapshot
        run: .github/scripts/publish-pages-snapshot.sh ./dist dev ./.pages

      - name: Build dev Supabase deployment
        run: yarn build
        env:
          VITE_BASE_PATH: "/${{ github.event.repository.name }}/dev-supabase/"
          VITE_STORAGE_ENGINE: supabase

      - name: Deploy current-only dev Supabase snapshot
        run: .github/scripts/publish-pages-snapshot.sh ./dist dev-supabase ./.pages

  pr-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    if: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/dev' }}

    steps:
      - name: Comment on PR
        uses: hasura/comment-progress@v2.3.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          number: ${{ github.event.number }}
          id: deploy-preview
          message: "Starting deployment of preview ⏳..."

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'yarn'

      - run: yarn install --immutable

      # Build with github environment variables
      - name: Build with github environment variables
        if: ${{ vars.VITE_STORAGE_ENGINE != '' }}
        run: VITE_STORAGE_ENGINE=$VITE_STORAGE_ENGINE VITE_BASE_PATH=$VITE_BASE_PATH yarn build
        env:
          VITE_STORAGE_ENGINE: ${{ vars.VITE_STORAGE_ENGINE }}
          VITE_BASE_PATH: "/${{ github.event.repository.name }}/PR${{ github.event.number }}/"

      - uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: .pages
          fetch-depth: 1

      - name: Push current-only PR deploy preview
        run: .github/scripts/publish-pages-snapshot.sh ./dist "PR${{ github.event.number }}" ./.pages

      - name: Update comment
        uses: hasura/comment-progress@v2.3.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          number: ${{ github.event.number }}
          id: deploy-preview
          message: "A preview of ${{ github.event.after }} is uploaded and can be seen here:\n\n ✨ https://revisit.dev/${{ github.event.repository.name }}/PR${{ github.event.number }} ✨\n\nChanges may take a few minutes to propagate."
