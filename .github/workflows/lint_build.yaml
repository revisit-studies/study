name: Lint and build

on: 
  pull_request:
    branches:
      - '**'
  
  push:
    branches:
      - main
      - dev

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'yarn'

      - name: Install yarn packages (from cache if available)
        run: yarn install --frozen-lockfile

      - name: Check version metadata and current pointers
        run: node scripts/release-version.mjs check pull-request

      - name: Check branch version suffix
        if: github.event_name == 'push'
        run: node scripts/release-version.mjs check "$GITHUB_REF_NAME"

      - name: Run linter
        run: yarn lint

      - name: Build application
        run: yarn build
