name: Lint and build

on: 
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - '**'
  
  push:
    branches:
      - main
      - dev

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch stable release tags
        if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && startsWith(github.event.pull_request.title, 'v') }}
        run: git fetch --tags --force origin

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'yarn'

      - name: Install yarn packages (from cache if available)
        run: yarn install --frozen-lockfile

      - name: Check version metadata and current pointers
        run: |
          if [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]]; then
            node scripts/release-version.mjs check-pr "$GITHUB_BASE_REF" "$PR_TITLE"
          else
            node scripts/release-version.mjs check "$GITHUB_REF_NAME"
          fi
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}

      - name: Check proposed release version is newer than the latest release
        if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' && startsWith(github.event.pull_request.title, 'v') }}
        run: node scripts/release-version.mjs validate-release-pr "$PR_TITLE"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

      - name: Run linter
        run: yarn lint

      - name: Build application
        run: yarn build
