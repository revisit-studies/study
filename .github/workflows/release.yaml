name: Release new version

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write

jobs:
  release:
    if: github.event.pull_request.merged
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.pull_request.title }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      - name: Validate release PR title
        run: node scripts/release-version.mjs validate-title "$RELEASE_TAG"

      - name: Prepare release
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            tagged_version="$(git show "$RELEASE_TAG:VERSION" 2>/dev/null | tr -d '\n')"
            if [[ "$tagged_version" == "${RELEASE_TAG#v}" ]] && git merge-base --is-ancestor "$RELEASE_TAG^{commit}" main; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "Release $RELEASE_TAG was already published; skipping duplicate commit, tag, and dispatch."
              exit 0
            fi
            echo "Tag $RELEASE_TAG already exists but does not identify this release on main." >&2
            exit 1
          fi

          node scripts/release-version.mjs release "$RELEASE_TAG"
          git add VERSION package.json package-lock.json src public docsLibraries README.md
          if [[ -f typedocReadMe.md ]]; then git add typedocReadMe.md; fi
          if ! git diff --cached --quiet; then
            git config --local user.email "jackwilburn@tutanota.com"
            git config --local user.name "Jack Wilburn"
            git commit -m "Release version $RELEASE_TAG"
          fi
          test "$(tr -d '\n' < VERSION)" = "${RELEASE_TAG#v}"
          git tag -a "$RELEASE_TAG" -m "Release version $RELEASE_TAG"
          git push origin main --follow-tags
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - uses: peter-evans/repository-dispatch@v4
        name: Build documentation in revisit.dev
        if: ${{ github.repository_owner == 'revisit-studies' && steps.prepare.outputs.publish == 'true' }}
        with:
          token: ${{ secrets.PAT }}
          repository: revisit-studies/reVISit-studies.github.io
          event-type: study_repo_publish
          client-payload: '{"release_tag": "${{ env.RELEASE_TAG }}"}'

      - uses: peter-evans/repository-dispatch@v4
        name: Publish revisitpy
        if: ${{ github.repository_owner == 'revisit-studies' && steps.prepare.outputs.publish == 'true' }}
        with:
          token: ${{ secrets.PAT }}
          repository: revisit-studies/revisitpy
          event-type: study_repo_publish
          client-payload: '{"release_tag": "${{ env.RELEASE_TAG }}"}'

      - uses: peter-evans/repository-dispatch@v4
        name: Publish revisitpy-server
        if: ${{ github.repository_owner == 'revisit-studies' && steps.prepare.outputs.publish == 'true' }}
        with:
          token: ${{ secrets.PAT }}
          repository: revisit-studies/revisitpy-server
          event-type: study_repo_publish
          client-payload: '{"release_tag": "${{ env.RELEASE_TAG }}"}'
