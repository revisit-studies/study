name: Release new version

on:
  pull_request:
    branches: [main]
    types: [closed]

jobs:
  release:
    if: github.event.pull_request.merged && startsWith(github.event.pull_request.title, 'v')
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.pull_request.title }}
    steps:
      - name: Ensure PR title matches vx.x.x
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
        shell: bash

      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PAT }}

      - name: Run make-release.sh to modify version numbers across the repo
        run: |
          find src public -type f -exec env LANG=C sed -i -E "s/githubusercontent\.com\/re[Vv][Ii][Ss]it-studies\/study\/.*\/src/githubusercontent.com\/revisit-studies\/study\/${RELEASE_TAG}\/src/g" {} +
          find src public -type f -exec env LANG=C sed -i -E "s/github.com\/re[Vv][Ii][Ss]it-studies\/study\/tree\/v[^\/]*\/([^\s]*)/github.com\/revisit-studies\/study\/tree\/${RELEASE_TAG}\/\1/g" {} +

      - name: Commit changes
        run: |
          git config --local user.email "jackwilburn@tutanota.com"
          git config --local user.name "Jack Wilburn"
          git add .
          git commit -m "Release version $RELEASE_TAG"
          git tag -a "$RELEASE_TAG" -m "Release version $RELEASE_TAG"
          git push --follow-tags

      - uses: peter-evans/repository-dispatch@v4
        name: Build documentation in revisit.dev if repo is in revisit-studies
        if: ${{ github.repository_owner == 'revisit-studies' }}
        with:
          token: ${{ secrets.PAT }}
          repository: revisit-studies/reVISit-studies.github.io
          event-type: study_repo_publish
          client-payload: '{"release_tag": "${{ env.RELEASE_TAG }}"}'

      - uses: peter-evans/repository-dispatch@v4
        name: Build documentation in revisit.dev if repo is in revisit-studies
        if: ${{ github.repository_owner == 'revisit-studies' }}
        with:
          token: ${{ secrets.PAT }}
          repository: revisit-studies/revisitpy
          event-type: study_repo_publish

      - uses: peter-evans/repository-dispatch@v4
        name: Build documentation in revisit.dev if repo is in revisit-studies
        if: ${{ github.repository_owner == 'revisit-studies' }}
        with:
          token: ${{ secrets.PAT }}
          repository: revisit-studies/revisitpy-server
          event-type: study_repo_publish
