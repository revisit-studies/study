name: Playwright Tests

on:
  pull_request:
    branches:
      - dev
      - main

jobs:
  chromium-fast:
    if: github.base_ref != 'main'
    name: 🧪 Chromium shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
      PW_CI_REPORTER: dot
      PW_CI_WORKERS: 1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: yarn

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: yarn install --immutable

      - name: Write out playwright version
        run: yarn --silent playwright --version > .playwright-version

      - name: ⚡️ Cache playwright binaries
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: /home/runner/.cache/ms-playwright
          key: ${{ runner.os }}-chromium-pw-${{ hashFiles('**/.playwright-version') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: yarn playwright install --with-deps --only-shell chromium

      - name: Run Playwright shard
        run: yarn test --project=chromium --shard=${{ matrix.shard }}/4

  chromium-main:
    if: github.base_ref == 'main'
    name: 🧪 Chromium full MVNV journey
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PLAYWRIGHT_BROWSERS_PATH: /home/runner/.cache/ms-playwright
      PW_CI_REPORTER: dot
      PW_CI_WORKERS: 1
      PW_INCLUDE_SLOW: 1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: yarn

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: yarn install --immutable

      - name: Write out playwright version
        run: yarn --silent playwright --version > .playwright-version

      - name: ⚡️ Cache playwright binaries
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: /home/runner/.cache/ms-playwright
          key: ${{ runner.os }}-chromium-pw-${{ hashFiles('**/.playwright-version') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: yarn playwright install --with-deps --only-shell chromium

      - name: Run full MVNV journey
        run: yarn test --project=chromium --grep '@slow-mvnv'
