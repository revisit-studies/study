name: Playwright Worker Benchmark

on:
  push:
    branches:
      - codex/playwright-stability

jobs:
  benchmark:
    name: ${{ matrix.project }} w${{ matrix.workers }} shard ${{ matrix.shard }}/${{ matrix.total_shards }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            os: ubuntu-latest
            cache_dir: /home/runner/.cache/ms-playwright
            workers: 2
            shard: 1
            total_shards: 1
          - project: chromium
            os: ubuntu-latest
            cache_dir: /home/runner/.cache/ms-playwright
            workers: 3
            shard: 1
            total_shards: 1
          - project: chromium
            os: ubuntu-latest
            cache_dir: /home/runner/.cache/ms-playwright
            workers: 4
            shard: 1
            total_shards: 1
          - project: chromium
            os: ubuntu-latest
            cache_dir: /home/runner/.cache/ms-playwright
            workers: 1
            shard: 1
            total_shards: 2
          - project: chromium
            os: ubuntu-latest
            cache_dir: /home/runner/.cache/ms-playwright
            workers: 1
            shard: 2
            total_shards: 2
          - project: chromium
            os: ubuntu-latest
            cache_dir: /home/runner/.cache/ms-playwright
            workers: 2
            shard: 1
            total_shards: 2
          - project: chromium
            os: ubuntu-latest
            cache_dir: /home/runner/.cache/ms-playwright
            workers: 2
            shard: 2
            total_shards: 2
          - project: chromium
            os: ubuntu-latest
            cache_dir: /home/runner/.cache/ms-playwright
            workers: 1
            shard: 1
            total_shards: 4
          - project: chromium
            os: ubuntu-latest
            cache_dir: /home/runner/.cache/ms-playwright
            workers: 1
            shard: 2
            total_shards: 4
          - project: chromium
            os: ubuntu-latest
            cache_dir: /home/runner/.cache/ms-playwright
            workers: 1
            shard: 3
            total_shards: 4
          - project: chromium
            os: ubuntu-latest
            cache_dir: /home/runner/.cache/ms-playwright
            workers: 1
            shard: 4
            total_shards: 4

          - project: webkit
            os: macos-14
            cache_dir: /Users/runner/Library/Caches/ms-playwright
            workers: 2
            shard: 1
            total_shards: 1
          - project: webkit
            os: macos-14
            cache_dir: /Users/runner/Library/Caches/ms-playwright
            workers: 3
            shard: 1
            total_shards: 1
          - project: webkit
            os: macos-14
            cache_dir: /Users/runner/Library/Caches/ms-playwright
            workers: 4
            shard: 1
            total_shards: 1
          - project: webkit
            os: macos-14
            cache_dir: /Users/runner/Library/Caches/ms-playwright
            workers: 1
            shard: 1
            total_shards: 2
          - project: webkit
            os: macos-14
            cache_dir: /Users/runner/Library/Caches/ms-playwright
            workers: 1
            shard: 2
            total_shards: 2
          - project: webkit
            os: macos-14
            cache_dir: /Users/runner/Library/Caches/ms-playwright
            workers: 2
            shard: 1
            total_shards: 2
          - project: webkit
            os: macos-14
            cache_dir: /Users/runner/Library/Caches/ms-playwright
            workers: 2
            shard: 2
            total_shards: 2
          - project: webkit
            os: macos-14
            cache_dir: /Users/runner/Library/Caches/ms-playwright
            workers: 1
            shard: 1
            total_shards: 4
          - project: webkit
            os: macos-14
            cache_dir: /Users/runner/Library/Caches/ms-playwright
            workers: 1
            shard: 2
            total_shards: 4
          - project: webkit
            os: macos-14
            cache_dir: /Users/runner/Library/Caches/ms-playwright
            workers: 1
            shard: 3
            total_shards: 4
          - project: webkit
            os: macos-14
            cache_dir: /Users/runner/Library/Caches/ms-playwright
            workers: 1
            shard: 4
            total_shards: 4

    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ matrix.cache_dir }}
      PW_CI_WORKERS: ${{ matrix.workers }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: yarn

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: yarn install --immutable

      - name: Write out playwright version
        run: yarn --silent playwright --version > .playwright-version

      - name: Cache playwright binaries
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ${{ matrix.cache_dir }}
          key: ${{ runner.os }}-${{ matrix.project }}-pw-${{ hashFiles('**/.playwright-version') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true' && matrix.project == 'chromium'
        run: yarn playwright install --with-deps --only-shell chromium

      - name: Install Playwright WebKit
        if: steps.playwright-cache.outputs.cache-hit != 'true' && matrix.project == 'webkit'
        run: yarn playwright install webkit

      - name: Run benchmark shard
        run: yarn test --project=${{ matrix.project }} --shard=${{ matrix.shard }}/${{ matrix.total_shards }} --reporter=dot
