name: Playwright Worker Benchmark

on:
  push:
    branches:
      - codex/playwright-stability

jobs:
  benchmark:
    name: WebKit w${{ matrix.workers }} shard ${{ matrix.shard }}/${{ matrix.total_shards }}
    runs-on: macos-14
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - workers: 1
            shard: 1
            total_shards: 4
          - workers: 1
            shard: 2
            total_shards: 4
          - workers: 1
            shard: 3
            total_shards: 4
          - workers: 1
            shard: 4
            total_shards: 4

    env:
      PLAYWRIGHT_BROWSERS_PATH: /Users/runner/Library/Caches/ms-playwright
      PW_CI_WORKERS: ${{ matrix.workers }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: yarn

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: yarn install --immutable

      - name: Write out playwright version
        run: yarn --silent playwright --version > .playwright-version

      - name: Cache playwright binaries
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: /Users/runner/Library/Caches/ms-playwright
          key: ${{ runner.os }}-webkit-pw-${{ hashFiles('**/.playwright-version') }}

      - name: Install Playwright WebKit
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: yarn playwright install webkit

      - name: Run benchmark shard
        run: yarn test --project=webkit --shard=${{ matrix.shard }}/${{ matrix.total_shards }} --reporter=dot
