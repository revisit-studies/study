<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Correlation Practice</title>
    <!-- Load revisit-communicate to be able to send data to reVISit -->
    <script src="../../revisitUtilities/revisit-communicate.js"></script>
    <script>
      let correct, r1, r2;

      // Get data from the config file
      Revisit.onDataReceive((data) => {
        r1 = data.r1Training;
        r2 = data.r2Training;

        correct = r2 > r1 ? 'right' : 'left';

        const imgLeftURL = `./img/training/${data.vis}-r1-${r1}-size_100.jpg`;
        const imgRightURL = `./img/training/${data.vis}-r2-${r2}-size_100.jpg`;

        // set left image
        document.getElementById("stimuli-left").src = imgLeftURL;
        // set right image
        document.getElementById("stimuli-right").src = imgRightURL;
        if (!window.frameElement?.inert) {
          document.getElementById("button-left").focus({ preventScroll: true });
        }
      })
    </script>
  </head>

  <body>
    <p>
      <span class="questionPrompt">Please select the visualization that appears to have a larger correlation.</span>
      <span class="requiredQuestion">*</span>
      <br/>
      <span class="questionSecondaryText">Click A or B, or use the left and right arrow keys.</span>
    </p>
    <div class="stimuliContainer">
      <div id="option-left" class="imgContainer">
        <img id="stimuli-left" data-answer="left" alt="Visualization A"/>
        <button id="button-left" data-answer="left">A</button>
      </div>
      <div id="option-right" class="imgContainer">
        <img id="stimuli-right" data-answer="right" alt="Visualization B"/>
        <button id="button-right" data-answer="right">B</button>
      </div>
    </div>
    <p id="feedback" role="status" style="text-align: center; font-weight: bold;"></p>
  </body>

  <script>
    let answered = false;

    function respond(selected) {
      if (answered || !correct || window.frameElement?.inert) return;
      answered = true;
      const isCorrect = selected === correct;
      const feedback = document.getElementById("feedback");
      feedback.textContent = `${isCorrect ? "Correct" : "Incorrect"} — A is ${r1}, B is ${r2}`;
      feedback.style.color = isCorrect ? "green" : "red";
      document.querySelectorAll("button").forEach((button) => { button.disabled = true; });
      Revisit.postAnswers({ training: isCorrect, selected, correct: isCorrect, corrLeft: r1, corrRight: r2 });
    }

    document.addEventListener("click", (event) => {
      const option = event.target.closest("[data-answer]");
      if (option) respond(option.dataset.answer);
    });

    document.addEventListener("keydown", (event) => {
      if (event.repeat || event.ctrlKey || event.metaKey || event.altKey || event.shiftKey) return;
      if (event.key !== "ArrowLeft" && event.key !== "ArrowRight") return;
      event.preventDefault();
      respond(event.key === "ArrowLeft" ? "left" : "right");
    });
  </script>

  <style>
    .stimuliContainer {
      display: inline-flex;
    }

    .imgContainer {
      width: 400px;
    }

    img {
      width: 300px;
      margin: 0px 50px;
    }

    button {
      display: block;
      font-size: 14px;
      color: #fff;
      background-color: #228be6;
      border: none;
      border-radius: 4px;
      height: 34px;
      padding: 4px 18px;
      margin: auto;
    }

    button:focus,
    button:hover,
    button:active {
      background-color: #1c7ccf;
    }
  </style>
</html>
