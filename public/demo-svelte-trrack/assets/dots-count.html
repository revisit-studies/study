<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Svelte Trrack Demo</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 24px;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .controls {
            display: flex;
            gap: 12px;
        }

        button {
            border: 1px solid light-dark(#9aa5b1, #5c5f66);
            border-radius: 4px;
            cursor: pointer;
            font: inherit;
            padding: 6px 12px;
        }

        :root {
            color-scheme: light dark;
        }

        body {
            background-color: light-dark(#ffffff, #242424);
            color: light-dark(#212529, #c1c2c5);
        }

        button {
            background-color: light-dark(#ffffff, #2e2e2e);
            border-color: light-dark(#9aa5b1, #5c5f66);
            color: light-dark(#212529, #c1c2c5);
        }

        button:hover:not(:disabled) {
            background-color: light-dark(#f5f7fa, #373a40);
        }

        button:disabled {
            background-color: light-dark(#f1f3f5, #2e2e2e);
            color: light-dark(#868e96, #909296);
            cursor: not-allowed;
        }

        button:focus-visible {
            outline: 2px solid light-dark(#1971c2, #74c0fc);
            outline-offset: 2px;
        }
    </style>
    <script type="importmap">
        {
            "imports": {
                "svelte/internal": "https://unpkg.com/svelte@3.59.2/internal/index.mjs"
            }
        }
    </script>
    <script src="https://unpkg.com/svelte@3.59.2/compiler.js"></script>
</head>

<body>
    <div id="app"></div>
    <div id="load-error" role="alert" hidden>
        Unable to load the Svelte dot counter.
    </div>

    <script src="../../revisitUtilities/revisit-communicate.js"></script>

    <script type="module">
        import { Registry, initializeTrrack } from 'https://cdn.jsdelivr.net/npm/@trrack/core@1.3.0/+esm';

        const taskId = 'circlesCount';
        const minDots = 0;
        const maxDots = 20;
        const initialState = {
            dots: [1]
        };

        const registry = Registry.create();
        const updateDots = registry.register(
            'update-dots',
            (state, task) => {
                if (task === 'add') {
                    const lastCount = state.dots[state.dots.length - 1] || 0;
                    state.dots.push(lastCount + 1);
                } else {
                    state.dots.pop();
                }
            }
        );

        const trrack = Revisit.createTrrack({
            initializeTrrack,
            initialState,
            registry
        });

        async function loadComponent() {
            const response = await fetch('./DotCounter.svelte');
            const source = await response.text();
            const compiled = svelte.compile(source, {
                format: 'esm'
            });
            const moduleUrl = URL.createObjectURL(new Blob([compiled.js.code], {
                type: 'text/javascript'
            }));
            const module = await import(moduleUrl);
            URL.revokeObjectURL(moduleUrl);
            return module.default;
        }

        try {
            const DotCounter = await loadComponent();

            function addDot() {
                if (trrack.getState().dots.length < maxDots) {
                    trrack.apply('Add Dot', updateDots('add'));
                }
            }

            function removeDot() {
                if (trrack.getState().dots.length > minDots) {
                    trrack.apply('Remove Dot', updateDots('remove'));
                }
            }

            const component = new DotCounter({
                target: document.getElementById('app'),
                props: {
                    dots: trrack.getState().dots,
                    addDot,
                    removeDot,
                    undo: () => trrack.undo(),
                    redo: () => trrack.redo()
                }
            });

            function updateRevisit() {
                const dots = trrack.getState().dots;
                component.$set({ dots });
                Revisit.postAnswers({
                    [taskId]: dots.length
                });
            }

            trrack.currentChange(updateRevisit);
            updateRevisit();

            Revisit.onProvenanceReceive((provenanceState) => {
                if (Array.isArray(provenanceState?.dots)) {
                    component.$set({ dots: provenanceState.dots });
                }
            });
        } catch (error) {
            document.getElementById('load-error').hidden = false;
            throw error;
        }
    </script>
</body>

</html>
